name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Subir API
      run: |
        nohup npm start > server.log 2>&1 &
        sleep 15 # Aumentar o tempo de espera para o servidor iniciar

    - name: Verificar logs do servidor
      run: |
        echo "Logs do servidor:" && cat server.log

    - name: Wait for API to start
      run: |
        until curl -s http://localhost:3000; do
          echo "Waiting for server to start..."
          sleep 2
        done

    - name: Run unit tests (exclude k6)
      run: |
        # Run only unit tests under test/controller and test/external to avoid executing k6 scripts with Node
        npx mocha "test/{controller,external}/**/*.test.js" --exit

  k6_performance:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Start API (background)
      run: |
        nohup npm start > server.log 2>&1 &
        sleep 10

    - name: Wait for API to start
      run: |
        until curl -s http://localhost:3000 >/dev/null; do
          echo "Waiting for server to start..."
          sleep 2
        done

    - name: Prepare k6 output directory
      run: |
        mkdir -p test/k6
        chmod 777 test/k6

    - name: Run k6 performance test (docker)
      run: |
        # Use host networking so the k6 container can reach the API started on the runner (localhost:3000)
        # Run the k6 'run' subcommand directly (no shell). Export raw results to JSON.
        docker run --rm --network host -v "${{ github.workspace }}":/src -w /src \
          grafana/k6:latest run --out json=/src/test/k6/results.json test/k6/cadastroHabito.test.js -e BASE_URL=http://localhost:3000

    - name: Generate HTML report from k6 JSON
      run: |
        # Use k6-reporter (installed on-the-fly via npx) to convert JSON to HTML
        npx --yes k6-reporter test/k6/results.json -o test/k6/report.html

    - name: Upload k6 results and report
      uses: actions/upload-artifact@v4
      with:
        name: k6-report
        path: |
          test/k6/results.json
          test/k6/report.html
