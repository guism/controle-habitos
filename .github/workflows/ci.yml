name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Subir API
      run: |
        nohup npm start > server.log 2>&1 &
        sleep 15 # Aumentar o tempo de espera para o servidor iniciar

    - name: Verificar logs do servidor
      run: |
        echo "Logs do servidor:" && cat server.log

    - name: Wait for API to start
      run: |
        until curl -s http://localhost:3000; do
          echo "Waiting for server to start..."
          sleep 2
        done

    - name: Run unit tests (exclude k6)
      run: |
        # Run only unit tests under test/controller and test/external to avoid executing k6 scripts with Node
        npx mocha "test/{controller,external}/**/*.test.js" --exit

  k6_performance:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Start API (background)
      run: |
        nohup npm start > server.log 2>&1 &
        sleep 10

    - name: Wait for API to start
      run: |
        until curl -s http://localhost:3000 >/dev/null; do
          echo "Waiting for server to start..."
          sleep 2
        done

    - name: Run k6 performance test (docker)
      run: |
        # Use host networking so the k6 container can reach the API started on the runner (localhost:3000)
        # Run a shell inside the container by overriding entrypoint, then execute k6 run and k6 report
        docker run --rm -u 0 --network host -v "${{ github.workspace }}":/src -w /src \
          --entrypoint sh grafana/k6:latest -c \
          "k6 run --out json=/src/test/k6/results.json test/k6/cadastroHabito.test.js -e BASE_URL=http://localhost:3000 && k6 report --out html=/src/test/k6/report.html /src/test/k6/results.json"

    - name: Upload k6 results
      uses: actions/upload-artifact@v4
      with:
        name: k6-report
        path: |
          test/k6/report.html
          test/k6/results.json
